plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id('com.gradleup.shadow') version '9.3.1' apply false
}

ext {
    publishableModules = [
            'kash-helper-common',
            'kash-helper-config',
            'kash-helper-paper',
            /*'kash-helper-jda',
            'kash-helper-hytale'

             */
    ] as Set
}

allprojects {
    group = 'xyz.imrine'
    version = '2.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
        mavenLocal()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'com.gradleup.shadow'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    tasks.test {
        useJUnitPlatform()
    }

    tasks.jar {
        archiveClassifier.set('plain')
    }

    tasks.shadowJar {
        archiveClassifier.set('')
        mergeServiceFiles()
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

    if (rootProject.publishableModules.contains(project.name)) {
        apply plugin: 'maven-publish'
        apply plugin: 'signing'

        publishing {
            publications {
                create('mavenJava', MavenPublication) {
                    artifactId = project.name
                    from components.java

                    pom {
                        name = "KashHelper ${project.name - 'kash-helper-'}".trim()
                        description = "${project.name} module for KashHelper"
                        url = 'https://imrine.xyz'
                        licenses {
                            license {
                                name = 'The Apache License, Version 2.0'
                                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            }
                        }
                        developers {
                            developer {
                                id = 'Bramsou'
                                name = 'Ibrahim'
                                email = 'braimsou@gmail.com'
                            }
                        }
                        scm {
                            url = 'https://github.com/Ibramsou/KashHelper'
                            connection = 'scm:git:git://github.com/Ibramsou/KashHelper.git'
                            developerConnection = 'scm:git:ssh://github.com/Ibramsou/KashHelper.git'
                        }
                    }
                }
            }

            repositories {
                maven {
                    name = 'Sonatype'
                    def releaseUrl = findProperty('mavenCentralReleaseUrl') ?: 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
                    def snapshotUrl = findProperty('mavenCentralSnapshotUrl') ?: 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
                    url = uri(project.version.toString().endsWith('-SNAPSHOT') ? snapshotUrl : releaseUrl)
                    credentials {
                        username = (findProperty('mavenCentralUsername') ?: System.getenv('MAVEN_CENTRAL_USERNAME'))?.toString()
                        password = (findProperty('mavenCentralPassword') ?: System.getenv('MAVEN_CENTRAL_PASSWORD'))?.toString()
                    }
                }
            }
        }

        def signingKeyFile = (findProperty('signingInMemoryKeyFile') ?: System.getenv('SIGNING_IN_MEMORY_KEY_FILE'))?.toString()
        def signingPassword = (findProperty('signingInMemoryKeyPassword') ?: System.getenv('SIGNING_IN_MEMORY_KEY_PASSWORD'))?.toString()
        def signingKey = (signingKeyFile && file(signingKeyFile).exists()) ? file(signingKeyFile).text : null

        signing {
            required {
                signingKey != null && signingPassword != null && gradle.taskGraph.allTasks.any { it.name.toLowerCase().contains('publish') }
            }
            if (signingKey && signingPassword) {
                useInMemoryPgpKeys(signingKey, signingPassword)
                sign publishing.publications.named('mavenJava').get()
            }
        }
    }
}
