plugins {
    id 'java'
}

group = 'fr.ibrakash.helper'
version = '1.7.4'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.20.0'
    testRuntimeOnly 'com.zaxxer:HikariCP:5.0.1'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.46.0.1'
    testRuntimeOnly 'org.spongepowered:configurate-core:4.2.0'
}

test {
    useJUnitPlatform()
}