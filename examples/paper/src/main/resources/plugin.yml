main: fr.ibrakash.helper.example.ExamplePlugin
author: Bramsou
version: 1.0.0
api-version: 1.21
name: Example
commands:
  example:
    usage: |
      /example gui
      /example paged
      /example persistence [reload]
      /example home set <name>
      /example home tp <name>
      /example home list
      /example home fav <name> [true|false]
      /example home delete <name>
      /example home top [limit]
      /example home reload
  exampledata:
    usage: |
      /exampledata create <id> [displayName]
      /exampledata score <id> <value>
      /exampledata points <id> <value>
      /exampledata setting <id> <notifications:true|false> <theme>
      /exampledata tag <add|remove|list> <id> [tag]
      /exampledata home <add|remove|list> <id> [...]
      /exampledata blob badge <id> <add|remove|list> [BADGE]
      /exampledata blob stat <id> <put|remove|list> ...
      /exampledata blob note <id> <add|remove|list> [text]
      /exampledata blob raw <id> <set|clear|len> [text]
      /exampledata top <cache|db|partial|dto|window|refresh> [limit]
      /exampledata rank <id>
      /exampledata rankupdate <id>
      /exampledata rankbulk <id1> [id2 ...]
      /exampledata seed <count>
      /exampledata saveall
      /exampledata save <id>
      /exampledata delete <id>
      /exampledata bulkload <id1> [id2 ...]
      /exampledata info <id>
libraries:
  - org.spongepowered:configurate-core:4.2.0
  - org.spongepowered:configurate-yaml:4.2.0
  - org.spongepowered:configurate-hocon:4.2.0
  - com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.20.0
  - com.zaxxer:HikariCP:5.0.1
